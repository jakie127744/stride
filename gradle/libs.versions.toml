# Version catalog — Phase 2 scaffold.
# Versions below are placeholders to get modules resolving; bump to current stable via
# Android Studio's "Upgrade" prompts on first sync rather than trusting these long-term,
# since exact patch releases drift fast (Compose BOM, AGP, and Media3 especially).

[versions]
agp = "8.13.2"
# Bumped from 2.0.21: org.maplibre.gl:android-sdk:13.5.0 (see app/build.gradle.kts) ships
# metadata compiled with Kotlin 2.2, which a 2.0.21 compiler can't read at all — not a style
# choice, a hard compile failure (kspDebugKotlin: "binary version is 2.2.0, expected 2.0.0").
# 2.2.10 is the resolved kotlin-stdlib version already winning via conflict resolution on
# :app's classpath (see MapLibre's own transitive requirement), so this just makes the
# compiler's declared version match what Gradle was already resolving at runtime.
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
composeBom = "2024.12.01"
navigationCompose = "2.8.4"
navigation3 = "1.0.0-alpha01"
# Bumped from 2.52: that version predates official support for the KSP2 out-of-process
# worker that ships with the ksp version above, and failed Hilt's own KSP step with
# "Expected @AndroidEntryPoint to have a value" — a known version-skew symptom, not a real
# missing annotation value.
hilt = "2.56.2"
hiltNavigationCompose = "1.2.0"
room = "2.7.0-alpha11"
media3 = "1.5.0"
healthConnect = "1.1.0"
coroutines = "1.9.0"
datastore = "1.1.1"
junit = "4.13.2"
androidxTestExt = "1.2.1"
androidxTestRunner = "1.6.2"
espresso = "3.6.1"

