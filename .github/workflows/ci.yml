name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # TEMPORARY: gradle/wrapper/gradle-wrapper.jar isn't committed yet (see README — it's a
      # binary this environment couldn't generate without a local JDK/Gradle install). Provisioning
      # Gradle directly here and calling `gradle` instead of `./gradlew` keeps CI working in the
      # meantime. Once the wrapper jar is committed (open the project in Android Studio once, or
      # run `gradle wrapper --gradle-version 8.10` locally), switch every step below back to
      # `./gradlew ...` for the usual reproducible-build guarantee and delete `gradle-version` here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Lint
        run: gradle lint

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Assemble debug
        run: gradle assembleDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: "**/build/reports/lint-results-*.html"
